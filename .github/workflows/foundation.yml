name: Compatibility foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: integration
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: integration/requirements-test.txt
      - name: Read pinned unpublished candidate commit
        id: candidate
        run: |
          python -c 'import json; print("commit=" + json.load(open("tests/fixtures/pystove_artifacts.json"))["rc2"]["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tofrie/pystove
          ref: ${{ steps.candidate.outputs.commit }}
          path: pystove-rc2-source
          persist-credentials: false
      - name: Build and verify the exact unpublished wheel and sdist (no upload)
        run: |
          python -m venv "$RUNNER_TEMP/rc2-builder"
          "$RUNNER_TEMP/rc2-builder/bin/python" -m pip install -r ../pystove-rc2-source/requirements-dev.txt
          "$RUNNER_TEMP/rc2-builder/bin/python" scripts/prepare_rc2_gate.py --source ../pystove-rc2-source --dist "$RUNNER_TEMP/rc2-artifacts"
      - name: Install exact hashed test environment
        run: |
          python - <<'PYLOCK'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          wheel = root / "rc2-artifacts/saynwerk_pystove-0.3.0rc2-py3-none-any.whl"
          lock = Path("requirements-test.txt").read_text()
          assert lock.count("saynwerk-pystove==0.3.0rc2") == 1
          (root / "rc2-requirements.txt").write_text(lock.replace(
              "saynwerk-pystove==0.3.0rc2", "saynwerk-pystove @ " + wheel.as_uri()
          ))
          PYLOCK
          python -m pip install --require-hashes -r "$RUNNER_TEMP/rc2-requirements.txt"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Ruff (check only, whole repository)
        run: ruff check .
      - name: Runtime hashes, manifest, structure and translations
        run: python scripts/check_integrity.py
      - name: Offline HA tests with strict known defects
        run: python -m pytest -q --junitxml=foundation-results.xml

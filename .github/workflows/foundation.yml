name: Compatibility foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install exact hashed test environment
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Ruff (check only, whole repository)
        run: ruff check .
      - name: Runtime hashes, manifest, structure and translations
        run: python scripts/check_integrity.py
      - name: Offline HA tests with strict known defects
        run: python -m pytest -q --junitxml=foundation-results.xml

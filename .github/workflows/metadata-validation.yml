name: Existing metadata validation

# Keep metadata validation independent of the offline compatibility foundation.
# Missing licensing remains visible; local private testing does not grant
# permission to distribute this integration publicly. This workflow publishes nothing.
on:
  push:
    branches:
      - baseline/ha-compatibility-foundation
      - fix/b01-registry-migration
      - fix/h01-setup-client-cleanup
      - fix/h02-create-cancellation
      - fix/h03-config-flow-client-cleanup
      - fix/h04-command-confirmation-errors
      - fix/h05-night-time-consistency
      - fix/m03-button-availability
      - fix/m08-duration-total-seconds
      - fix/m07-ha-local-clock
      - release/saynwerk-hwam-stove-1.0.0rc1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pinned official hassfest image
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/github/workspace"
          ghcr.io/home-assistant/hassfest@sha256:39031fe75baf5566814a01f3c414764c029c54a0e1d742965d5b94a0d6120875

  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pinned official HACS validator (no comments)
        uses: docker://ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
        env:
          INPUT_CATEGORY: integration
          # Infer the repository/ref from the push event. An explicit repository
          # override makes HACS validate the default branch instead of this RC.
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_COMMENT: 'false'
